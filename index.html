<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Wedding of Lucia & Matteo</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Cormorant Garamond', serif;
      color: #ffffff;
      background-color: #0f172a;
      overflow-x: hidden;
    }

    /* Hero Banner Container */
    .hero-banner {
      position: relative;
      width: 100vw;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem 1rem;
      /* استبدل الرابط أدناه بمسار الصورة الخاصة بك */
      background-image: url('https://images.unsplash.com/photo-1519741497674-611481863552?q=80&w=2070&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* Overlay Layer for Text Readability */
    .hero-banner::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.35) 0%,
        rgba(0, 0, 0, 0.45) 50%,
        rgba(0, 0, 0, 0.6) 100%
      );
      z-index: 1;
    }

    /* Content Overlay */
    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 600px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    /* Language Switcher */
    .lang-switcher {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      z-index: 3;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 0.4rem 0.9rem;
      border-radius: 20px;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 1px;
      color: #fff;
    }

    /* Typography */
    .subtitle {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      font-weight: 300;
      margin-bottom: 0.5rem;
      opacity: 0.9;
    }

    .names {
      font-size: 3.5rem;
      font-weight: 400;
      line-height: 1.1;
      letter-spacing: 0.02em;
    }

    .ampersand {
      font-style: italic;
      font-size: 2rem;
      margin: 0.2rem 0;
      opacity: 0.85;
      font-family: 'Cormorant Garamond', serif;
    }

    .date-location {
      margin-top: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .date {
      font-family: 'Montserrat', sans-serif;
      font-size: 1rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      font-weight: 400;
    }

    .venue {
      font-size: 1.35rem;
      font-weight: 400;
      opacity: 0.95;
    }

    .location {
      font-size: 1.1rem;
      opacity: 0.85;
      font-style: italic;
    }

    /* Floating Music Button Concept */
    .music-btn {
      position: fixed;
      bottom: 2rem;
      right: 1.5rem;
      z-index: 10;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    @media (max-width: 480px) {
      .names {
        font-size: 2.75rem;
      }
      .venue {
        font-size: 1.2rem;
      }
      .date {
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>

  <header class="hero-banner">
    <div class="lang-switcher">ES | EN</div>

    <div class="hero-content">
      <p class="subtitle">The Wedding Of</p>
      
      <h1 class="names">Lucia</h1>
      <span class="ampersand">&amp;</span>
      <h1 class="names">Matteo</h1>

      <div class="date-location">
        <p class="date">27 July 2027</p>
        <p class="venue">Château de la Couronne</p>
        <p class="location">Nouvelle-Aquitaine, France</p>
      </div>
    </div>

    <button class="music-btn" aria-label="Toggle Music">
      🎵
    </button>
  </header>

</body>
</html>
