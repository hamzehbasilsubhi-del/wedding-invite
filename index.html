<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة زفاف</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background-color: #f5f2eb; overflow: hidden; font-family: sans-serif; }
        
        /* 1. الغلاف الثابت */
        #cover-screen { width: 100%; height: 100%; background: url('cover.jpg') no-repeat center center/cover; position: absolute; z-index: 3; display: flex; justify-content: center; align-items: center; }
        
        /* الزر الشفاف المخفي فوق الختم */
        #seal-button { width: 150px; height: 150px; background: transparent; border: none; cursor: pointer; border-radius: 50%; }
        
        /* 2. شاشة الفيديو */
        #video-screen { width: 100%; height: 100%; position: absolute; z-index: 2; display: none; background: #fff; }
        video { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
        
        /* 3. شاشة الدعوة الرئيسية */
        #invitation-screen { width: 100%; min-height: 100%; position: absolute; z-index: 1; display: none; text-align: center; padding: 50px 20px; background-color: #f9f9f9; }
    </style>
</head>
<body>

    <!-- الشاشة الأولى: صورة الغلاف والختم -->
    <div id="cover-screen">
        <button id="seal-button" onclick="startExperience()"></button>
    </div>

    <!-- الشاشة الثانية: فيديو فتح المغلف -->
    <div id="video-screen">
        <video id="transition-video" playsinline>
            <source src="transition.mp4" type="video/mp4">
        </video>
    </div>

    <!-- الشاشة الثالثة: محتوى الدعوة (الذي سنصممه لاحقاً) -->
    <div id="invitation-screen">
        <h1 style="color: #2C3E50; margin-bottom: 20px;">أهلاً بكم في زفافنا</h1>
        <p>هنا سنقوم ببناء تفاصيل الدعوة، العداد التنازلي، والخرائط خطوة بخطوة...</p>
    </div>

    <!-- الموسيقى الخلفية -->
    <audio id="bg-music" src="music.mp3" loop></audio>

    <script>
        function startExperience() {
            // إخفاء صورة الغلاف
            document.getElementById('cover-screen').style.display = 'none';
            
            // تجهيز الفيديو والموسيقى
            const videoScreen = document.getElementById('video-screen');
            const video = document.getElementById('transition-video');
            const music = document.getElementById('bg-music');
            
            // عرض وتشغيل الفيديو والموسيقى
            videoScreen.style.display = 'block';
            video.play();
            music.play();

            // عند انتهاء الفيديو، يتم إخفاؤه وتظهر الدعوة
            video.onended = function() {
                videoScreen.style.display = 'none';
                const invScreen = document.getElementById('invitation-screen');
                invScreen.style.display = 'block';
                // السماح بالتمرير (Scroll) في صفحة الدعوة
                document.body.style.overflow = 'auto';
            };
        }
    </script>
</body>
</html>
